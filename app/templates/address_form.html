{% extends "base.html" %}

{% block content %}

<div class="container py-5" style="max-width: 750px;">

    <h2 class="fw-bold mb-4">
        {{ "Edit Address" if address else "Add New Address" }}
    </h2>

    <form method="POST" id="addressForm" novalidate>

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" id="fullName" class="form-control"
                value="{{ address.name if address else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" name="phone" id="phone" class="form-control" maxlength="10" inputmode="numeric"
                value="{{ address.phone if address else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ address.email if address else '' }}"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">House / Street / Area</label>
            <textarea name="address" class="form-control" rows="3"
                required>{{ address.address if address else '' }}</textarea>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">City</label>
                <input type="text" name="city" class="form-control" value="{{ address.city if address else '' }}"
                    required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">State</label>

                <select name="state" class="form-select" required>
                    <option value="">Select State</option>

                    {% set states = [
                    "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar",
                    "Chhattisgarh", "Goa", "Gujarat", "Haryana",
                    "Himachal Pradesh", "Jharkhand", "Karnataka", "Kerala",
                    "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya",
                    "Mizoram", "Nagaland", "Odisha", "Punjab", "Rajasthan",
                    "Sikkim", "Tamil Nadu", "Telangana", "Tripura",
                    "Uttar Pradesh", "Uttarakhand", "West Bengal",
                    "Andaman and Nicobar Islands", "Chandigarh",
                    "Dadra and Nagar Haveli and Daman and Diu",
                    "Delhi", "Jammu and Kashmir", "Ladakh",
                    "Lakshadweep", "Puducherry"
                    ] %}

                    {% for s in states %}
                    <option value="{{ s }}" {% if address and address.state==s %}selected{% endif %}>
                        {{ s }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">PIN Code</label>
            <input type="text" name="pincode" id="pincode" maxlength="6" inputmode="numeric" class="form-control"
                value="{{ address.pincode if address else '' }}" required>
        </div>

        <div class="form-check mb-4">
            <input type="checkbox" name="is_default" class="form-check-input" id="is_default" {% if address and
                address.is_default %}checked{% endif %}>
            <label class="form-check-label" for="is_default">
                Set as default delivery address
            </label>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Address
        </button>

        <a href="{{ url_for('main.my_addresses') }}" class="btn btn-outline-secondary">
            Cancel
        </a>

    </form>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const form = document.getElementById("addressForm");

        const name = document.getElementById("fullName");
        const phone = document.getElementById("phone");
        const pincode = document.getElementById("pincode");
        const email = form.querySelector('[name="email"]');

        form.addEventListener("submit", function (event) {

            // Clear previous errors
            [name, phone, pincode, email].forEach(field => {
                field.setCustomValidity("");
            });

            // Full name validation
            if (!/^[A-Za-z ]+$/.test(name.value.trim())) {
                name.setCustomValidity("Enter a valid full name");
            }

            // Mobile number validation
            if (!/^[0-9]{10}$/.test(phone.value.trim())) {
                phone.setCustomValidity(
                    "Enter a valid 10-digit mobile number"
                );
            }

            // Email validation
            if (!email.validity.valid || !email.value.trim()) {
                email.setCustomValidity("Enter a valid email address");
            }

            // PIN validation
            if (!/^[0-9]{6}$/.test(pincode.value.trim())) {
                pincode.setCustomValidity(
                    "Enter a valid 6-digit PIN code"
                );
            }

            // Show validation message
            if (!form.checkValidity()) {
                event.preventDefault();
                form.reportValidity();
            }

        });

    });
</script>


{% endblock %}
